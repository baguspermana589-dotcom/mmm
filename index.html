<style>
    body {

        overflow: hidden;
    }

    .container {

    }

    }

    button {
        padding: 12px 25px;
        font-size: 18px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.3s;
        margin: 10px;
    }

    .yes {
        background: #ff4d6d;
        color: white;
    }

    .no {
        background: white;
        color: black;
    }

    .gif {
        width: 250px;
        margin-top: 20px;
    }

    .heart {
        position: absolute;
        top: -20px;
        color: red;
        animation: fall 4s linear infinite;
        font-size: 20px;
    }

    @keyframes fall {
        to {
            transform: translateY(100vh);
        }
    }
</style>
</head>
